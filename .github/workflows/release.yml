name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/swedish_calendar_plus/manifest.json)"
          if [[ "$RELEASE_TAG" != "v$manifest_version" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build integration archive
        run: >-
          zip -r swedish_calendar_plus.zip
          custom_components/swedish_calendar_plus
          -x '*/__pycache__/*' '*.pyc'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" swedish_calendar_plus.zip --generate-notes
